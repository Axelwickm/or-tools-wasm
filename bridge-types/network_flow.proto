syntax = "proto3";

package ortools_wasm.bridge.v1;

message NetworkFlowBridgeRequest {
  oneof payload {
    MaxFlowRequest max_flow = 1;
    MinCostFlowRequest min_cost_flow = 2;
    LinearSumAssignmentRequest linear_sum_assignment = 3;
  }
}

message MaxFlowRequest {
  repeated int32 tails = 1;
  repeated int32 heads = 2;
  repeated int64 capacities = 3;
  int32 source = 4;
  int32 sink = 5;
}

message MinCostFlowRequest {
  repeated int32 tails = 1;
  repeated int32 heads = 2;
  repeated int64 capacities = 3;
  repeated int64 unit_costs = 4;
  repeated int64 supplies = 5;
  bool solve_max_flow_with_min_cost = 6;
}

message LinearSumAssignmentRequest {
  repeated int32 left_nodes = 1;
  repeated int32 right_nodes = 2;
  repeated int64 costs = 3;
}

message NetworkFlowBridgeResponse {
  int32 status = 1;
  int64 optimal_flow = 2;
  int64 optimal_cost = 3;
  int64 maximum_flow = 4;
  int32 num_nodes = 5;
  int32 num_arcs = 6;
  repeated int64 flows = 7;
  repeated int32 source_side_min_cut = 8;
  repeated int32 sink_side_min_cut = 9;
  repeated int32 right_mates = 10;
  repeated int64 assignment_costs = 11;
}
