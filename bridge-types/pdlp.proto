syntax = "proto3";

package ortools_wasm.bridge.v1;

// PDLP executor payload messages.
//
// The generic job.proto envelope supplies request identity, lifecycle,
// failures, resources, and cancellation. This schema only describes PDLP
// operations and results shared by worker and server execution.

message PdlpSparseMatrixEntry {
  int32 row = 1;
  int32 column = 2;
  double value = 3;
}

message PdlpQuadraticProgram {
  int32 num_variables = 1;
  int32 num_constraints = 2;
  string problem_name = 3;
  double objective_offset = 4;
  double objective_scaling_factor = 5;
  repeated double objective_vector = 6;
  repeated double objective_matrix_diagonal = 7;
  bool has_objective_matrix_diagonal = 8;
  repeated double constraint_lower_bounds = 9;
  repeated double constraint_upper_bounds = 10;
  repeated double variable_lower_bounds = 11;
  repeated double variable_upper_bounds = 12;
  repeated string variable_names = 13;
  repeated string constraint_names = 14;
  repeated PdlpSparseMatrixEntry constraint_matrix_entries = 15;
}

message PdlpSolveParameters {
  optional int32 iteration_limit = 1;
  optional int32 termination_check_frequency = 2;
  optional double eps_optimal_relative = 3;
  optional double eps_optimal_absolute = 4;
  optional int32 l_inf_ruiz_iterations = 5;
  optional bool l2_norm_rescaling = 6;
  optional int32 num_threads = 7;
}

message PdlpInitialSolution {
  repeated double primal_solution = 1;
  repeated double dual_solution = 2;
}

message PdlpValidateRequest {
  PdlpQuadraticProgram quadratic_program = 1;
}

message PdlpIsLinearRequest {
  PdlpQuadraticProgram quadratic_program = 1;
}

message PdlpFromMpModelRequest {
  bytes mp_model_proto = 1;
  bool relax_integer_variables = 2;
  bool include_names = 3;
}

message PdlpToMpModelRequest {
  PdlpQuadraticProgram quadratic_program = 1;
}

message PdlpSolveRequest {
  PdlpQuadraticProgram quadratic_program = 1;
  PdlpSolveParameters parameters = 2;
  PdlpInitialSolution initial_solution = 3;
}

message PdlpBridgeRequest {
  oneof payload {
    PdlpValidateRequest validate = 1;
    PdlpIsLinearRequest is_linear = 2;
    PdlpFromMpModelRequest from_mp_model = 3;
    PdlpToMpModelRequest to_mp_model = 4;
    PdlpSolveRequest solve = 5;
  }
}

message PdlpSolverResult {
  repeated double primal_solution = 1;
  repeated double dual_solution = 2;
  repeated double reduced_costs = 3;
  int32 termination_reason = 4;
  int32 iteration_count = 5;
}

message PdlpValidateResult {
  string message = 1;
}

message PdlpIsLinearResult {
  bool value = 1;
}

message PdlpFromMpModelResult {
  PdlpQuadraticProgram quadratic_program = 1;
}

message PdlpToMpModelResult {
  bytes mp_model_proto = 1;
}

message PdlpSolveResult {
  PdlpSolverResult solver_result = 1;
}

message PdlpBridgeResponse {
  oneof payload {
    PdlpValidateResult validate_result = 1;
    PdlpIsLinearResult is_linear_result = 2;
    PdlpFromMpModelResult from_mp_model_result = 3;
    PdlpToMpModelResult to_mp_model_result = 4;
    PdlpSolveResult solve_result = 5;
  }
}
