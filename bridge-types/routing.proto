syntax = "proto3";

package ortools_wasm.bridge.v1;

message RoutingMatrix {
  repeated int64 values = 1;
  int32 dimension = 2;
  // Sampled JS callbacks use routing indices, including duplicate depots.
  // Native node matrices retain the default false value.
  bool routing_indices = 3;
  bool unary = 4;
}

message RoutingAddDimension {
  RoutingMatrix transit_matrix = 1;
  int64 slack_max = 2;
  int64 capacity = 3;
  bool fix_start_cumul_to_zero = 4;
  string name = 5;
}

message RoutingAddDimensionWithVehicleCapacity {
  RoutingMatrix transit_matrix = 1;
  int64 slack_max = 2;
  repeated int64 capacities = 3;
  bool fix_start_cumul_to_zero = 4;
  string name = 5;
}

message RoutingAddDimensionWithVehicleTransits {
  repeated RoutingMatrix transit_matrices = 1;
  int64 slack_max = 2;
  int64 capacity = 3;
  bool fix_start_cumul_to_zero = 4;
  string name = 5;
}

message RoutingAddDimensionWithVehicleTransitAndCapacity {
  repeated RoutingMatrix transit_matrices = 1;
  int64 slack_max = 2;
  repeated int64 capacities = 3;
  bool fix_start_cumul_to_zero = 4;
  string name = 5;
}

message RoutingPiecewiseLinearFunction {
  repeated int64 x = 1;
  repeated int64 y = 2;
}

message RoutingStateDependentMatrix {
  // Half-open cumul domain. Functions are in row-major routing-index order.
  int64 domain_start = 1;
  int64 domain_end = 2;
  repeated RoutingPiecewiseLinearFunction functions = 3;
}

message RoutingAddDependentDimension {
  repeated RoutingMatrix transit_matrices = 1;
  repeated RoutingStateDependentMatrix dependent_matrices = 2;
  optional string base_dimension = 3;
  int64 slack_max = 4;
  repeated int64 capacities = 5;
  bool fix_start_cumul_to_zero = 6;
  string name = 7;
}

message RoutingAddConstantDimension {
  int64 value = 1;
  int64 capacity = 2;
  bool fix_start_cumul_to_zero = 3;
  string name = 4;
  optional int64 slack_max = 5;
}

message RoutingAddVectorDimension {
  repeated int64 values = 1;
  int64 capacity = 2;
  bool fix_start_cumul_to_zero = 3;
  string name = 4;
}

message RoutingAddMatrixDimension {
  RoutingMatrix matrix = 1;
  int64 capacity = 2;
  bool fix_start_cumul_to_zero = 3;
  string name = 4;
}

message RoutingSweepPoint { int32 x = 1; int32 y = 2; }
message RoutingSetSweepArranger { repeated RoutingSweepPoint points = 1; }
message RoutingOrderedActivityGroup { repeated int32 disjunctions = 1; }

message RoutingAddDisjunction {
  repeated int64 indices = 1;
  optional int64 penalty = 2;
  optional int64 max_cardinality = 3;
  optional int32 penalty_cost_behavior = 4;
}

message RoutingAddPickupAndDelivery {
  int64 pickup = 1;
  int64 delivery = 2;
}

message RoutingAddPickupAndDeliverySets {
  int32 pickup_disjunction = 1;
  int32 delivery_disjunction = 2;
}

message RoutingSetPickupToDeliveryLimits {
  string dimension_name = 1;
  int32 pair_index = 2;
  repeated int64 limits = 3;
}

message RoutingAddVehicleEqualityConstraint {
  int64 left = 1;
  int64 right = 2;
}

message RoutingAddCumulLessOrEqualConstraint {
  string dimension_name = 1;
  int64 left = 2;
  int64 right = 3;
}

message RoutingSetNextValues {
  int64 index = 1;
  repeated int64 values = 2;
}

message RoutingSetVehicleValues {
  int64 index = 1;
  repeated int32 values = 2;
}

message RoutingSetAllowedVehiclesForIndex {
  repeated int32 vehicles = 1;
  int64 index = 2;
}

message RoutingSetSlackBounds {
  string dimension_name = 1;
  int64 index = 2;
  int64 lower = 3;
  int64 upper = 4;
}

message RoutingSetActiveValues {
  int64 index = 1;
  repeated int32 values = 2;
}

enum RoutingDimensionValueKind {
  ROUTING_DIMENSION_VALUE_KIND_UNSPECIFIED = 0;
  ROUTING_DIMENSION_VALUE_KIND_SPAN_UPPER_BOUND = 1;
  ROUTING_DIMENSION_VALUE_KIND_SPAN_COST = 2;
  ROUTING_DIMENSION_VALUE_KIND_SLACK_COST = 3;
  ROUTING_DIMENSION_VALUE_KIND_GLOBAL_SPAN_COST = 4;
}

message RoutingSetDimensionValue {
  string dimension_name = 1;
  RoutingDimensionValueKind kind = 2;
  int64 value = 3;
  optional int32 vehicle = 4;
}

message RoutingSetCumulBounds {
  string dimension_name = 1;
  int64 index = 2;
  int64 lower = 3;
  int64 upper = 4;
}

message RoutingAddNodePrecedence {
  string dimension_name = 1;
  int64 first = 2;
  int64 second = 3;
  int64 offset = 4;
  int32 performed_constraint = 5;
}

message RoutingSetSoftSpanUpperBound {
  string dimension_name = 1;
  int64 bound = 2;
  int64 cost = 3;
  int32 vehicle = 4;
}

message RoutingSetQuadraticCostSoftSpanUpperBound {
  string dimension_name = 1;
  int64 bound = 2;
  int64 cost = 3;
  int32 vehicle = 4;
}

message RoutingSetArcCostEvaluatorOfVehicles {
  RoutingMatrix transit_matrix = 1;
  reserved 2;
  reserved "vehicle";
  repeated int32 vehicles = 3;
}

message RoutingSetCumulSoftBound {
  string dimension_name = 1;
  int64 index = 2;
  int64 bound = 3;
  int64 coefficient = 4;
  bool lower = 5;
}

message RoutingSetMaximumActiveVehicles { int32 maximum = 1; }
message RoutingSetFixedVehicleCost { int64 cost = 1; int32 vehicle = 2; }
message RoutingSetAmortizedVehicleCosts {
  int64 linear = 1;
  int64 quadratic = 2;
  int32 vehicle = 3;
}
message RoutingSetVehicleUsedWhenEmpty { bool is_used = 1; int32 vehicle = 2; }

message RoutingAddSoftSameVehicleConstraint { repeated int64 indices = 1; int64 cost = 2; }
message RoutingSetPickupDeliveryPolicy { int32 policy = 1; int32 vehicle = 2; }

message RoutingSetVisitType {
  int64 index = 1;
  int32 type = 2;
  int32 policy = 3;
}

message RoutingAddHardTypeIncompatibility {
  int32 type1 = 1;
  int32 type2 = 2;
}
message RoutingAddTemporalTypeIncompatibility {
  int32 type1 = 1;
  int32 type2 = 2;
}

enum RoutingTypeRequirementKind {
  SAME_VEHICLE = 0;
  WHEN_ADDING = 1;
  WHEN_REMOVING = 2;
}
message RoutingAddTypeRequirement {
  RoutingTypeRequirementKind kind = 1;
  int32 dependent_type = 2;
  repeated int32 required_type_alternatives = 3;
}

enum RoutingFinalizerKind {
  ROUTING_FINALIZER_UNSPECIFIED = 0;
  ROUTING_FINALIZER_MINIMIZE = 1;
  ROUTING_FINALIZER_MAXIMIZE = 2;
  ROUTING_FINALIZER_TARGET = 3;
}

enum RoutingVariableKind {
  ROUTING_VARIABLE_UNSPECIFIED = 0;
  ROUTING_VARIABLE_CUMUL = 1;
  ROUTING_VARIABLE_SLACK = 2;
  ROUTING_VARIABLE_NEXT = 3;
  ROUTING_VARIABLE_VEHICLE = 4;
  ROUTING_VARIABLE_ACTIVE = 5;
  ROUTING_VARIABLE_TRANSIT = 6;
  ROUTING_VARIABLE_FIXED_TRANSIT = 7;
  // index is a vehicle ID rather than a routing index.
  ROUTING_VARIABLE_ACTIVE_VEHICLE = 8;
  // index is a vehicle ID rather than a routing index.
  ROUTING_VARIABLE_ROUTE_CONSIDERED = 9;
  // index is a vehicle ID; resource_group identifies the group.
  ROUTING_VARIABLE_RESOURCE = 10;
  // index identifies a registered reified Boolean variable.
  ROUTING_VARIABLE_BOOLEAN = 11;
  // index identifies a registered native nonlinear expression variable.
  ROUTING_VARIABLE_EXPRESSION = 12;
}

message RoutingAddFinalizer {
  RoutingVariableKind variable_kind = 1;
  string dimension_name = 2;
  int64 index = 3;
  RoutingFinalizerKind kind = 4;
  int64 target = 5;
  // Presence distinguishes weighted priority zero from an ordinary finalizer.
  optional int64 weight = 6;
  int32 resource_group = 7;
}

message RoutingVariableReference {
  RoutingVariableKind kind = 1;
  string dimension_name = 2;
  int64 index = 3;
  int32 resource_group = 4;
}

message RoutingSetTabuVars {
  repeated RoutingVariableReference variables = 1;
  bool reset = 2;
}

enum RoutingDomainAction {
  ROUTING_DOMAIN_UNSPECIFIED = 0;
  ROUTING_DOMAIN_RANGE = 1;
  ROUTING_DOMAIN_VALUES = 2;
  ROUTING_DOMAIN_REMOVE_INTERVAL = 3;
  ROUTING_DOMAIN_REMOVE_VALUES = 4;
}
message RoutingModifyDomain {
  RoutingVariableReference variable = 1;
  RoutingDomainAction action = 2;
  int64 lower = 3;
  int64 upper = 4;
  repeated int64 values = 5;
}
message RoutingLinearTerm {
  RoutingVariableReference variable = 1;
  int64 coefficient = 2;
}
message RoutingLinearExpression {
  repeated RoutingLinearTerm terms = 1;
  int64 offset = 2;
}
message RoutingLinearComparison {
  RoutingLinearExpression left = 1;
  RoutingLinearExpression right = 2;
  // 1: equal, 2: not equal, 3: <=, 4: >=, 5: <, 6: >.
  int32 comparison = 3;
}
message RoutingAddLinearConstraint {
  RoutingLinearExpression left = 1;
  RoutingLinearExpression right = 2;
  // 1: equal, 2: not equal, 3: <=, 4: >=, 5: <, 6: >.
  int32 comparison = 3;
  // Enforce the comparison only when all these comparisons hold.
  repeated RoutingLinearComparison conditions = 4;
  repeated RoutingBooleanExpression boolean_conditions = 5;
}
message RoutingArcCostQuery {
  int64 from_index = 1;
  int64 to_index = 2;
  int32 vehicle = 3;
}

message RoutingDomainQuery {
  RoutingVariableReference variable = 1;
  optional int64 contains_value = 2;
  optional bool soft_lower_bound = 3;
}
message RoutingDomainResult {
  int64 min = 1;
  int64 max = 2;
  uint64 size = 3;
  bool bound = 4;
  optional bool contains = 5;
  optional int64 soft_bound = 6;
}

message RoutingModelOperation {
  oneof operation {
    RoutingAddDimension add_dimension = 1;
    RoutingAddDimensionWithVehicleCapacity add_dimension_with_vehicle_capacity = 2;
    RoutingAddDimensionWithVehicleTransits add_dimension_with_vehicle_transits = 3;
    RoutingAddConstantDimension add_constant_dimension = 4;
    RoutingAddVectorDimension add_vector_dimension = 5;
    RoutingAddMatrixDimension add_matrix_dimension = 6;
    RoutingAddDisjunction add_disjunction = 7;
    RoutingAddPickupAndDelivery add_pickup_and_delivery = 8;
    RoutingAddVehicleEqualityConstraint add_vehicle_equality_constraint = 9;
    RoutingAddCumulLessOrEqualConstraint add_cumul_less_or_equal_constraint = 10;
    RoutingSetSoftSpanUpperBound set_soft_span_upper_bound = 11;
    RoutingSetQuadraticCostSoftSpanUpperBound set_quadratic_cost_soft_span_upper_bound = 12;
    RoutingSetArcCostEvaluatorOfVehicles set_arc_cost_evaluator_of_vehicles = 13;
    RoutingAddNodePrecedence add_node_precedence = 14;
    RoutingSetCumulBounds set_cumul_bounds = 15;
    RoutingSetAllowedVehiclesForIndex set_allowed_vehicles_for_index = 16;
    RoutingSetVehicleValues set_vehicle_values = 17;
    RoutingSetNextValues set_next_values = 18;
    RoutingSetSlackBounds set_slack_bounds = 19;
    RoutingSetActiveValues set_active_values = 20;
    RoutingSetDimensionValue set_dimension_value = 21;
    RoutingSetCumulSoftBound set_cumul_soft_bound = 22;
    RoutingSetMaximumActiveVehicles set_maximum_active_vehicles = 23;
    RoutingSetFixedVehicleCost set_fixed_vehicle_cost = 24;
    RoutingSetAmortizedVehicleCosts set_amortized_vehicle_costs = 25;
    RoutingSetVehicleUsedWhenEmpty set_vehicle_used_when_empty = 26;
    RoutingAddSoftSameVehicleConstraint add_soft_same_vehicle_constraint = 27;
    RoutingSetPickupDeliveryPolicy set_pickup_delivery_policy = 28;
    RoutingAddDimensionWithVehicleTransitAndCapacity add_dimension_with_vehicle_transit_and_capacity = 29;
    RoutingSetVisitType set_visit_type = 30;
    RoutingAddHardTypeIncompatibility add_hard_type_incompatibility = 31;
    RoutingAddTemporalTypeIncompatibility add_temporal_type_incompatibility = 32;
    RoutingAddTypeRequirement add_type_requirement = 33;
    RoutingAddFinalizer add_finalizer = 34;
    RoutingModifyDomain modify_domain = 35;
    RoutingAddLinearConstraint add_linear_constraint = 36;
    RoutingAddBooleanVariable add_boolean_variable = 37;
    RoutingAddBooleanConstraint add_boolean_constraint = 38;
    RoutingAddIntegerExpression add_integer_expression = 39;
    RoutingAddBreakInterval add_break_interval = 40;
    RoutingSetBreakIntervals set_break_intervals = 41;
    RoutingSetBreakDistanceDuration set_break_distance_duration = 42;
    RoutingSetPathEnergyCosts set_path_energy_costs = 43;
    RoutingAddSameActivityGroup add_same_activity_group = 44;
    RoutingAddDependentDimension add_dependent_dimension = 45;
    RoutingAddPickupAndDeliverySets add_pickup_and_delivery_sets = 46;
    RoutingSetPickupToDeliveryLimits set_pickup_to_delivery_limits = 47;
    RoutingMatrix set_first_solution_evaluator = 48;
    string set_primary_constrained_dimension = 49;
    RoutingAddRouteConstraint add_route_constraint = 50;
    RoutingSetPiecewiseCost set_piecewise_cost = 51;
    RoutingAddForbiddenIntervals add_forbidden_intervals = 52;
    RoutingSetSweepArranger set_sweep_arranger = 53;
    RoutingOrderedActivityGroup add_ordered_activity_group = 54;
    RoutingSetTabuVars set_tabu_vars = 55;
    bool ignore_disjunctions_already_forced_to_zero = 56;
  }
}

message RoutingPiecewiseCostSegment { int64 point_x = 1; int64 point_y = 2; int64 slope = 3; int64 other_point_x = 4; }
message RoutingSetPiecewiseCost { string dimension_name = 1; int64 index = 2; repeated RoutingPiecewiseCostSegment segments = 3; }
enum RoutingDimensionQueryKind {
  ROUTING_DIMENSION_QUERY_TRANSIT = 0;
  ROUTING_DIMENSION_QUERY_TRANSIT_CLASS = 1;
  ROUTING_DIMENSION_QUERY_ALLOWED_INTERVALS = 2;
  ROUTING_DIMENSION_QUERY_FORBIDDEN_INTERVALS = 3;
  ROUTING_DIMENSION_QUERY_FIRST_ALLOWED = 4;
  ROUTING_DIMENSION_QUERY_LAST_ALLOWED = 5;
  ROUTING_DIMENSION_QUERY_PIECEWISE_COST = 6;
  ROUTING_DIMENSION_QUERY_VEHICLE_CLASS = 7;
  ROUTING_DIMENSION_QUERY_IS_UNARY = 8;
  ROUTING_DIMENSION_QUERY_PICKUP_DELIVERY_LIMIT = 9;
  ROUTING_DIMENSION_QUERY_NODE_PRECEDENCES = 10;
  ROUTING_DIMENSION_QUERY_TRANSITS_POSITIVE = 11;
  ROUTING_DIMENSION_QUERY_TRANSIT_SIGN = 12;
  // Requires initial_assignment.snapshot and bound native route/current cumul.
  ROUTING_DIMENSION_QUERY_SHORTEST_TRANSITION_SLACK = 13;
}
enum RoutingModelQueryKind {
  ROUTING_MODEL_QUERY_VEHICLE_COST_CLASS = 0;
  ROUTING_MODEL_QUERY_HAS_VEHICLE_COST_CLASS = 1;
  ROUTING_MODEL_QUERY_COST_CLASSES_COUNT = 2;
  ROUTING_MODEL_QUERY_NONZERO_COST_CLASSES_COUNT = 3;
  ROUTING_MODEL_QUERY_HOMOGENEOUS_COSTS = 4;
  ROUTING_MODEL_QUERY_ARC_COST_FOR_CLASS = 5;
  ROUTING_MODEL_QUERY_UNPERFORMED_PENALTY = 6;
  ROUTING_MODEL_QUERY_UNPERFORMED_PENALTY_OR_VALUE = 7;
  ROUTING_MODEL_QUERY_UNARY_DIMENSIONS = 8;
  ROUTING_MODEL_QUERY_SOFT_OR_SPAN_DIMENSIONS = 9;
  ROUTING_MODEL_QUERY_SINGLE_NODES_OF_TYPE = 10;
  ROUTING_MODEL_QUERY_PAIR_INDICES_OF_TYPE = 11;
  ROUTING_MODEL_QUERY_VEHICLE_CLASS = 12;
  ROUTING_MODEL_QUERY_VEHICLE_CLASSES_COUNT = 13;
  ROUTING_MODEL_QUERY_VEHICLE_OF_CLASS = 14;
  ROUTING_MODEL_QUERY_VISIT_TYPE_COMPONENTS = 15;
  ROUTING_MODEL_QUERY_SORTED_VISIT_TYPES = 16;
  ROUTING_MODEL_QUERY_SAME_VEHICLE_INDICES = 17;
  ROUTING_MODEL_QUERY_VEHICLES_OF_SAME_CLASS = 18;
  ROUTING_MODEL_QUERY_SAME_VEHICLE_CLASS_ARCS = 19;
  ROUTING_MODEL_QUERY_SORTED_NODE_PRECEDENCES = 20;
  ROUTING_MODEL_QUERY_DISJUNCTION_MAX_CARDINALITY = 21;
  ROUTING_MODEL_QUERY_HAS_MAX_CARDINALITY_CONSTRAINED_DISJUNCTIONS = 22;
  ROUTING_MODEL_QUERY_PERFECT_BINARY_DISJUNCTIONS = 23;
  ROUTING_MODEL_QUERY_SINGLETON_NODES = 24;
  ROUTING_MODEL_QUERY_VEHICLE_ALLOWED = 25;
  ROUTING_MODEL_QUERY_FIRST_SOLUTION_ARC_COST = 26;
  // Result value is -1 for no matching sibling.
  ROUTING_MODEL_QUERY_FIRST_MATCHING_PICKUP_DELIVERY_SIBLING = 27;
  ROUTING_MODEL_QUERY_ARC_MORE_CONSTRAINED = 28;
  ROUTING_MODEL_QUERY_IS_MATCHING_MODEL = 29;
  // Uses the request search parameters, including native defaults.
  ROUTING_MODEL_QUERY_ROUTES_INTERDEPENDENT = 30;
}
message RoutingModelQuery {
  RoutingModelQueryKind kind = 1;
  int64 index = 2;
  int64 other_index = 3;
  int32 vehicle_or_class = 4;
  int64 default_value = 5;
  int32 predicate_evaluator = 6;
  int64 third_index = 7;
}
message RoutingIndexGroup { repeated int32 indices = 1; }
message RoutingIndexGroups { repeated RoutingIndexGroup groups = 1; }
message RoutingModelInspection {
  optional int64 value = 1;
  repeated int32 dimension_indices = 2;
  repeated int32 indices = 3;
  repeated RoutingIndexGroup groups = 4;
  repeated RoutingIndexGroups precedence_groups = 5;
}
message RoutingDimensionQuery {
  string dimension_name = 1; RoutingDimensionQueryKind kind = 2;
  int64 index = 3; int64 other_index = 4; int32 vehicle_or_class = 5;
  int64 lower = 6; int64 upper = 7;
  int32 pair_index = 8; int32 pickup_alternative_index = 9; int32 delivery_alternative_index = 10;
}
message RoutingAddForbiddenIntervals { string dimension_name = 1; int64 index = 2; repeated RoutingInt64Interval intervals = 3; }
message RoutingInt64Interval { int64 start = 1; int64 end = 2; }
message RoutingDimensionInspection {
  optional int64 value = 1; repeated RoutingInt64Interval intervals = 2;
  bool has_piecewise_linear_cost = 3; repeated RoutingPiecewiseCostSegment cost_segments = 4;
  repeated RoutingNodePrecedence node_precedences = 5;
}
message RoutingNodePrecedence {
  int64 first = 1; int64 second = 2; int64 offset = 3; int32 performed_constraint = 4;
}

message RoutingAddRouteConstraint { int32 evaluator = 1; bool costs_are_homogeneous_across_vehicles = 2; }
message RoutingPickupDeliveryPosition { int32 pair_index = 1; int32 alternative_index = 2; }
message RoutingPickupDeliveryInspection {
  RoutingPickupDeliveryPosition pickup = 1;
  RoutingPickupDeliveryPosition delivery = 2;
  bool is_pickup = 3;
  bool is_delivery = 4;
}
message RoutingBreakInspectionRequest { string dimension_name = 1; int32 vehicle = 2; }
message RoutingBreakDistanceDuration { int64 distance = 1; int64 duration = 2; }
message RoutingBreakConfiguration {
  bool has_break_constraints = 1;
  repeated int32 intervals = 2;
  repeated RoutingBreakDistanceDuration distance_duration = 3;
  optional int32 pre_travel_evaluator = 4;
  optional int32 post_travel_evaluator = 5;
}

message RoutingRoute {
  repeated int64 indices = 1;
}

message RoutingInitialAssignment {
  repeated RoutingRoute routes = 1;
  bool ignore_inactive_indices = 2;
  RoutingAssignmentSnapshot snapshot = 3;
}

message RoutingAssignmentSnapshot {
  repeated RoutingAssignmentVariable variables = 1;
  repeated RoutingBreakAssignment intervals = 2;
  optional int64 objective_value = 3;
  optional int64 objective_min = 4;
  optional int64 objective_max = 5;
}
// Source route variables already use the target index-manager layout.
message RoutingAssignmentTransfer {
  repeated int32 next_values = 1;
  repeated int32 vehicle_values = 2;
}
message RoutingRouteLocks {
  repeated RoutingRoute routes = 1;
  bool close_routes = 2;
}
message RoutingPreAssignment {
  map<int32, int32> next_values = 1;
}

enum RoutingAssignmentAction {
  ROUTING_ASSIGNMENT_ACTION_SOLVE = 0;
  ROUTING_ASSIGNMENT_ACTION_PACK = 1;
  ROUTING_ASSIGNMENT_ACTION_COMPACT = 2;
  ROUTING_ASSIGNMENT_ACTION_COMPACT_AND_CHECK = 3;
  ROUTING_ASSIGNMENT_ACTION_FAST_SOLVE = 4;
  ROUTING_ASSIGNMENT_ACTION_MULTIPLE_STARTS = 5;
  ROUTING_ASSIGNMENT_ACTION_LOWER_BOUND = 6;
  ROUTING_ASSIGNMENT_ACTION_CHECK_FEASIBILITY = 7;
}
message RoutingCumulOptimizers {
  repeated string global_dimensions = 1;
  repeated string local_dimensions = 2;
}
message RoutingSearchStatistics {
  int64 num_cp_sat_calls_in_lp_scheduling = 1;
  int64 num_glop_calls_in_lp_scheduling = 2;
  int64 num_min_cost_flow_calls = 3;
  int64 num_cp_sat_calls_in_routing = 4;
  int64 num_generalized_cp_sat_calls_in_routing = 5;
  optional int64 num_decisions_in_first_solution = 6;
  optional int64 num_rejects_in_first_solution = 7;
}
message RoutingSolution {
  int64 objective_value = 1;
  repeated int64 next_values = 2;
  repeated int64 starts = 3;
  repeated int64 ends = 4;
  repeated RoutingDimensionValues dimensions = 5;
  repeated int32 vehicle_values = 6;
  repeated RoutingAssignmentVariable assignment_variables = 7;
  repeated RoutingResourceAssignment resource_assignments = 8;
  repeated RoutingBreakAssignment break_assignments = 9;
}

message RoutingBridgeRequest {
  int32 num_locations = 1;
  int32 num_vehicles = 2;
  repeated int32 starts = 3;
  repeated int32 ends = 4;
  reserved 5, 6;
  reserved "first_solution_strategy", "solution_limit";
  RoutingMatrix transit_matrix = 7;
  repeated RoutingModelOperation operations = 8;
  repeated string dimension_names = 9;
  RoutingInitialAssignment initial_assignment = 10;
  bool interruptible = 11;
  // Sparse operations_research.RoutingSearchParameters override.
  bytes search_parameters_proto = 12;
  repeated string search_parameter_fields = 13;
  bytes model_parameters_proto = 14;
  repeated string model_parameter_fields = 15;
  bool solution_events = 16;
  bool track_unchecked_neighbors = 17;
  // Restore and validate initial routes without optimizing them.
  bool read_assignment_only = 18;
  // Inspect native domains after replaying model operations, before search.
  repeated RoutingDomainQuery domain_queries = 19;
  repeated RoutingArcCostQuery arc_cost_queries = 20;
  repeated RoutingResourceGroup resource_groups = 21;
  // Close the native model and inspect one group without searching.
  optional int32 resource_inspection_group = 22;
  bool inspect_activity_groups = 23;
  RoutingRouteLocks route_locks = 24;
  bool inspect_pre_assignment = 25;
  RoutingAssignmentSnapshot first_solution_hint = 26;
  RoutingAssignmentAction assignment_action = 27;
  repeated RoutingAssignmentSnapshot candidate_assignments = 28;
  double packing_duration_seconds = 29;
  bool check_solution_in_cp = 30;
  bool inspect_cumul_optimizers = 31;
  bool call_at_solution_monitors = 32;
  optional int32 pickup_delivery_inspection_index = 33;
  RoutingBreakInspectionRequest break_inspection = 34;
  RoutingDimensionQuery dimension_query = 35;
  bool search_entry_events = 36;
  RoutingModelQuery model_query = 37;
  RoutingRoute route_cost_query = 38;
  // Independently constructed model used by native insertion reoptimization.
  RoutingBridgeRequest secondary_model = 39;
  RoutingAssignmentTransfer assignment_transfer = 40;
}

message RoutingSetPathEnergyCosts {
  string force = 1;
  string distance = 2;
  int64 threshold = 3;
  int64 cost_below = 4;
  int64 cost_above = 5;
  int32 vehicle = 6;
}
message RoutingAddSameActivityGroup { repeated int32 indices = 1; }
message RoutingActivityGroup { repeated int32 indices = 1; }
message RoutingActivityGroups {
  repeated int32 groups = 1;
  repeated RoutingActivityGroup members = 2;
}

message RoutingDimensionValues {
  string name = 1;
  repeated int64 cumul_values = 2;
  repeated int64 cumul_mins = 3;
  repeated int64 cumul_maxs = 4;
}

message RoutingAssignmentVariable {
  RoutingVariableReference variable = 1;
  int64 min = 2;
  int64 max = 3;
}

message RoutingRouteCost { optional int64 cost = 1; }

message RoutingBridgeResponse {
  bool has_solution = 1;
  int32 status = 2;
  int64 objective_value = 3;
  repeated int64 next_values = 4;
  repeated int64 starts = 5;
  repeated int64 ends = 6;
  repeated RoutingDimensionValues dimensions = 7;
  string local_search_profile = 8;
  RoutingSolveEvent solve_event = 9;
  // Native VehicleVar values by routing index, including -1 for dropped nodes.
  repeated int32 vehicle_values = 10;
  optional int32 automatic_first_solution_strategy = 11;
  repeated RoutingDomainResult domain_results = 12;
  repeated int64 arc_costs = 13;
  repeated RoutingAssignmentVariable assignment_variables = 14;
  repeated RoutingResourceAssignment resource_assignments = 15;
  RoutingResourceInspection resource_inspection = 16;
  repeated RoutingBreakAssignment break_assignments = 17;
  RoutingActivityGroups activity_groups = 18;
  optional bool locks_applied = 19;
  RoutingPreAssignment pre_assignment = 20;
  repeated RoutingSolution collected_solutions = 21;
  optional bool time_limit_reached = 22;
  optional int64 computed_lower_bound = 23;
  optional int64 objective_lower_bound = 24;
  RoutingSearchStatistics search_statistics = 25;
  RoutingCumulOptimizers cumul_optimizers = 26;
  optional bool assignment_feasible = 27;
  RoutingPickupDeliveryInspection pickup_delivery_inspection = 28;
  RoutingBreakConfiguration break_configuration = 29;
  RoutingDimensionInspection dimension_inspection = 30;
  bool search_entered = 31;
  RoutingModelInspection model_inspection = 32;
  RoutingRouteCost route_cost = 33;
  RoutingAssignmentSnapshot assignment_seed = 34;
}

message RoutingAddBreakInterval {
  int32 index = 1;
  int64 start_min = 2;
  int64 start_max = 3;
  int64 duration = 4;
  bool optional = 5;
  string name = 6;
}
message RoutingSetBreakIntervals {
  string dimension_name = 1;
  repeated int32 intervals = 2;
  int32 vehicle = 3;
  RoutingMatrix pre_travel = 4;
  RoutingMatrix post_travel = 5;
  optional int32 pre_travel_handle = 6;
  optional int32 post_travel_handle = 7;
}
message RoutingSetBreakDistanceDuration {
  string dimension_name = 1;
  int32 vehicle = 2;
  int64 distance = 3;
  int64 duration = 4;
}
message RoutingBreakAssignment {
  int32 index = 1;
  int64 performed_min = 2;
  int64 performed_max = 3;
  optional int64 start_min = 4;
  optional int64 start_max = 5;
  optional int64 end_min = 6;
  optional int64 end_max = 7;
}

message RoutingSolveEvent {
  int64 objective_value = 1;
  int64 solution_count = 2;
  bool unchecked = 3;
}

message RoutingResource {
  string dimension_name = 1;
  repeated int64 start_domain = 2;
  repeated int64 end_domain = 3;
}
message RoutingVehicleResources {
  int32 vehicle = 1;
  repeated int32 resources = 2;
}
message RoutingResourceGroup {
  repeated RoutingResource resources = 1;
  repeated int32 required_vehicles = 2;
  repeated RoutingVehicleResources allowed_resources = 3;
}
message RoutingResourceAssignment {
  repeated int64 mins = 1;
  repeated int64 maxs = 2;
}

message RoutingInspectedResource {
  int32 class_index = 1;
  repeated RoutingResource dimension_attributes = 2;
}
message RoutingResourceClass {
  repeated int32 resource_indices = 1;
  repeated RoutingResource dimension_attributes = 2;
}
message RoutingResourceInspection {
  repeated string affected_dimensions = 1;
  repeated RoutingInspectedResource resources = 2;
  repeated RoutingResourceClass classes = 3;
}

message RoutingBooleanExpression {
  // 1: constant, 2: Boolean variable, 3: comparison, 4: AND, 5: OR, 6: NOT.
  int32 kind = 1;
  bool value = 2;
  RoutingVariableReference variable = 3;
  RoutingLinearComparison comparison = 4;
  repeated RoutingBooleanExpression operands = 5;
}
message RoutingAddBooleanVariable {
  int32 index = 1;
  RoutingBooleanExpression expression = 2;
}
message RoutingAddBooleanConstraint {
  RoutingBooleanExpression expression = 1;
}

message RoutingAddIntegerExpression {
  int32 index = 1;
  // 1: product (two operands), 2: absolute value (one), 3: minimum, 4: maximum.
  int32 kind = 2;
  repeated RoutingLinearExpression operands = 3;
}
